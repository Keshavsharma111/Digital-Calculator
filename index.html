<!DOCTYPE html>
<html>
<head>
    <title>My Calculator Project</title>
    <style>
        body {
            background: #2c3e50; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calc-container {
            background: #ecf0f1;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 10px 10px 0px #bdc3c7;
            width: 320px;
        }

        h1 {
            text-align: center;
            color: #34495e;
            font-size: 1.2rem;
            margin-top: 0;
        }

        #screen {
            width: 100%;
            height: 60px;
            font-size: 2rem;
            text-align: right;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 10px;
            box-sizing: border-box;
            background: #fff;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 50px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .num-btn { background: #95a5a6; color: white; }
        .op-btn { background: #3498db; color: white; }
        .clear-btn { background: #e67e22; color: white; grid-column: span 2; }
        .equal-btn { background: #27ae60; color: white; grid-column: span 2; }
        
        button:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="calc-container">
        <h1>CALCULATOR</h1>
        <input type="text" id="screen" readonly placeholder="0">
        
        <div class="btn-grid">
            <button class="clear-btn" onclick="clearAll()">Clear</button>
            <button class="op-btn" onclick="press('/')">/</button>
            <button class="op-btn" onclick="press('*')">x</button>

            <button class="num-btn" onclick="press('7')">7</button>
            <button class="num-btn" onclick="press('8')">8</button>
            <button class="num-btn" onclick="press('9')">9</button>
            <button class="op-btn" onclick="press('-')">-</button>

            <button class="num-btn" onclick="press('4')">4</button>
            <button class="num-btn" onclick="press('5')">5</button>
            <button class="num-btn" onclick="press('6')">6</button>
            <button class="op-btn" onclick="press('+')">+</button>

            <button class="num-btn" onclick="press('1')">1</button>
            <button class="num-btn" onclick="press('2')">2</button>
            <button class="num-btn" onclick="press('3')">3</button>
            <button class="num-btn" onclick="press('0')">0</button>

            <button class="num-btn" onclick="press('.')">.</button>
            <button class="equal-btn" onclick="answer()">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
